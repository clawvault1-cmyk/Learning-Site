name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Keep internal files off the public site
        run: |
          rm -rf _internal docs assets/src
          rm -f build.py make_pdf.py README.md _config.yml
          find packs -type f \( -name '*.pdf' -o -name 'contact-sheet.png' -o -name '*.py' -o -name '*.json' \) -print -delete
          find . -name '*.md' -not -path './.git/*' -print -delete
          # Defense in depth: nothing under _internal should ship even if the
          # delete above is skipped.
          rm -rf _internal
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
